name: monolith
services:
  media-init:
    image: monolith-django:latest
    pull_policy: never
    user: root
    command: ["chown", "-R", "app:app", "/app/media"]
    volumes:
      - media:/app/media
    restart: "no"

  frontend:
    image: monolith-frontend:latest
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - media:/media:ro
    depends_on:
      django:
        condition: service_healthy
      node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  django:
    image: monolith-django:latest
    build: .
    env_file:
      - .env
      - .env.docker
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL de Neon en .env}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,django
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET:?Configura JWT_SHARED_SECRET en .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  node:
    image: monolith-node:latest
    build: ./catalog-service
    env_file:
      - .env.docker
    environment:
      PORT: "4000"
      NODE_ENV: production
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      DJANGO_API_URL: http://django:8000/api
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET:?Configura JWT_SHARED_SECRET en .env}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: monolith_observability
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      django:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  media:
  mongo_data:
