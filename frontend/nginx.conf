log_format monolith_safe '$remote_addr "$request_method" $status $body_bytes_sent';
access_log /var/log/nginx/access.log monolith_safe;

server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;
    location = /carrito/ { return 308 /carrito$is_args$args; }
    location = /catalogo/ { return 308 /catalogo$is_args$args; }

    location /catalog-service/ {
        proxy_pass http://node:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        proxy_pass http://node:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assistant/ {
        proxy_pass http://node:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(api|admin|static|i18n|catalogo|carrito)/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /media/ {
        alias /media/;
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
