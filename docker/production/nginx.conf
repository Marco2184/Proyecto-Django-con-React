log_format monolith_safe '$remote_addr "$request_method" $status $body_bytes_sent';
access_log /var/log/nginx/access.log monolith_safe;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Only Caddy publishes ports. Clients cannot supply this trusted hop directly.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;

    location = /healthz { access_log off; return 200 'ok'; }
    location = /readyz { proxy_pass http://django:8000/ready/; }
    location /catalog-service/ { proxy_pass http://node:4000/; }
    location /auth/ { proxy_pass http://node:4000; }
    location /assistant/ { proxy_pass http://node:4000; }
    location /api/ { proxy_pass http://django:8000; }
    location /static/ { proxy_pass http://django:8000; }
    location /i18n/ { proxy_pass http://django:8000; }

    # /admin is the React panel; Django's full entity admin has its own prefix.
    location /django-admin/ { proxy_pass http://django:8000; }
    location /media/ { alias /media/; }
    location /covers/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location / { try_files $uri $uri/ /index.html; }
}
