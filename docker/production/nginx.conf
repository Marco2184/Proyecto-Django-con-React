
proxy_cache_path /tmp/monolith-cache
    keys_zone=monolith_public_cache:16m
    max_size=64m inactive=5m use_temp_path=off;

resolver 127.0.0.11 valid=5s ipv6=off;

upstream node_pool {
    zone node_pool 64k;
    server node:4000 resolve max_fails=0;
    keepalive 128;
}

log_format monolith_safe '$remote_addr "$request_method" '
    '$status $body_bytes_sent '
    'request_time=$request_time '
    'upstream_time=$upstream_response_time '
    'cache=$upstream_cache_status';
access_log /var/log/nginx/access.log monolith_safe;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Only Caddy publishes ports. Clients cannot supply this trusted hop directly.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;

    location = /healthz { access_log off; return 200 'ok'; }
    location = /readyz { proxy_pass http://django:8000/ready/; }

    location = /catalog-service/api/productos/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache monolith_public_cache;
        proxy_cache_key "$scheme|$proxy_host|$request_uri|$http_origin|$http_accept_language";
        proxy_cache_valid 200 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;

        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;

        add_header X-Monolith-Cache $upstream_cache_status always;

        proxy_pass http://node_pool/api/productos/;
    }

    location = /catalog-service/api/categorias/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache monolith_public_cache;
        proxy_cache_key "$scheme|$proxy_host|$request_uri|$http_origin|$http_accept_language";
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;

        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;

        add_header X-Monolith-Cache $upstream_cache_status always;

        proxy_pass http://node_pool/api/categorias/;
    }

    location = /catalog-service/api/plataformas/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache monolith_public_cache;
        proxy_cache_key "$scheme|$proxy_host|$request_uri|$http_origin|$http_accept_language";
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;

        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;

        add_header X-Monolith-Cache $upstream_cache_status always;

        proxy_pass http://node_pool/api/plataformas/;
    }

    location /catalog-service/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://node_pool/;
    }
    location /auth/ { proxy_pass http://node_pool; }
    location /assistant/ { proxy_pass http://node_pool; }
    location /api/ { proxy_pass http://django:8000; }
    location /static/ { proxy_pass http://django:8000; }
    location /i18n/ { proxy_pass http://django:8000; }

    # /admin is the React panel; Django's full entity admin has its own prefix.
    location /django-admin/ { proxy_pass http://django:8000; }
    location /media/ { alias /media/; }
    location /covers/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location / { try_files $uri $uri/ /index.html; }
}
