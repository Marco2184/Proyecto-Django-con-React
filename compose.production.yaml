name: monolith-production

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  security_opt: [no-new-privileges:true]

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: monolith.production_settings
  DATABASE_URL: ${DATABASE_URL:?Set the Neon application URL}
  SECRET_KEY: ${SECRET_KEY:?Set a random Django secret}
  JWT_SHARED_SECRET: ${JWT_SHARED_SECRET:?Set a shared JWT secret}
  DEBUG: "False"
  DEPLOYMENT_HTTPS: "True"
  ALLOWED_HOSTS: ${DOMAIN:?Set the public hostname},localhost,127.0.0.1,django
  FRONTEND_URL: https://${DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${DOMAIN}
  CSRF_TRUSTED_ORIGINS: https://${DOMAIN}

services:
  edge:
    <<: *runtime
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 768m
  frontend:
    <<: *runtime
    image: monolith-frontend:${RELEASE:-gce-80}
    build: ./frontend
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/media:ro
    depends_on:
      django: {condition: service_healthy}
      node: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
  django:
    <<: *runtime
    image: monolith-django:gce-80-catalog
    build: .
    env_file: [.env.production]
    environment: *django-env
    command:
      - sh
      - -c
      - >-
        python manage.py collectstatic --noinput &&
        exec gunicorn monolith.wsgi:application --bind 0.0.0.0:8000
        --workers 2 --threads 4 --timeout 60 --max-requests 1000
        --max-requests-jitter 100 --access-logfile -
        --access-logformat '%(m)s %(s)s %(L)s'
    volumes: [media:/app/media]
    depends_on:
      media-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/ready/', headers={'X-Forwarded-Proto': 'https'}), timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2048m
  node:
    <<: *runtime
    image: monolith-node:gce-80-product-cache
    build: ./catalog-service
    environment:
      NODE_ENV: production
      PORT: "4000"
      NODE_OPTIONS: --max-old-space-size=256
      DJANGO_API_URL: http://django:8000/api
      ALLOWED_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a different refresh JWT secret}
      CACHE_TTL_MS: "5000"
      MONOLITH_PERF_LOG: "0"
    depends_on:
      django: {condition: service_healthy}
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
  media-init:
    image: monolith-django:${RELEASE:-gce-80}
    user: root
    command: [chown, "-R", "app:app", /app/media]
    volumes: [media:/app/media]
    restart: "no"

  operations:
    profiles: [operations]
    image: monolith-django:${RELEASE:-gce-80}
    env_file: [.env.production]
    environment: *django-env
    command: [python, manage.py, showmigrations, --plan]
    volumes: [media:/app/media]
    restart: "no"

  backup:
    profiles: [operations]
    image: postgres:18-alpine
    environment:
      PGDATABASE: ${DATABASE_URL_DIRECT:?Set the direct Neon URL for backups}
      PGCONNECT_TIMEOUT: "15"
      PGSSLMODE: require
    entrypoint: [sh, /backup.sh]
    volumes:
      - ./docker/production/backup.sh:/backup.sh:ro
      - ./.private/gce-backups:/backups
      - media:/media:ro
    restart: "no"

volumes:
  media:
  certificates:
  caddy_config:
