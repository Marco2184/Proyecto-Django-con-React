services:
  catalog:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DJANGO_API_URL: ${DJANGO_API_URL:-http://host.docker.internal:8000/api}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: monolith_observability
      CACHE_TTL_MS: 45000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
    restart: unless-stopped
  mongo:
    image: mongo:7
    volumes:
      - mongo_catalog_data:/data/db
    restart: unless-stopped
volumes:
  mongo_catalog_data:
